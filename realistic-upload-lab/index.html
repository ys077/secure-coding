<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Buffer Lab</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="text-center mb-4">
        <h1 class="app-logo" style="font-size: 2rem">BUFFER LAB</h1>
        <p class="text-muted mt-2">
          Input Validation & Memory Safety Demonstration
        </p>
      </div>

      <div class="card">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input
              type="text"
              id="username"
              class="form-control"
              required
              placeholder="Enter username"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              required
              placeholder="Enter password"
            />
          </div>

          <button type="submit" class="btn btn-primary mt-3">Sign In</button>
          <div
            id="login-error"
            class="text-danger mt-3 text-center"
            style="display: none; font-size: 0.9rem"
          >
            Invalid credentials.
          </div>
        </form>
      </div>

      <div class="mt-4 text-center">
        <p class="text-muted" style="font-size: 0.85rem">
          Demo accounts: student / student123
        </p>
      </div>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
